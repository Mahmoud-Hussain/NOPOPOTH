<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="payment.css">
</head>
<body class="bg-white">
    <div class="container mx-auto py-10">
        <div class="max-w-2xl mx-auto bg-orange-50 shadow-md rounded-lg p-6">
            <h1 class="text-2xl font-bold text-center mb-6 text-orange-600">Choose Your Payment Method</h1>
            <form id="paymentForm" action="/process_payment.php" method="POST">
                <!-- Amount Input -->
                <div class="mb-4">
                    <label for="amount" class="block text-sm font-medium text-gray-700">Amount (BDT)</label>
                    <input type="number" name="amount" id="amount" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter amount" required>
                </div>

                <!-- Payment Methods -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Select Payment Method</label>
                    <div class="grid grid-cols-2 gap-4 mt-2">
                        <!-- bKash -->
                        <div class="payment-method border p-4 rounded-lg text-center" data-method="bkash">
                            <img src="https://via.placeholder.com/100x50?text=bKash" alt="bKash Logo" class="mx-auto">
                            <p class="mt-2 text-sm font-medium text-orange-600">bKash</p>
                        </div>

                        <!-- Nagad -->
                        <div class="payment-method border p-4 rounded-lg text-center" data-method="nagad">
                            <img src="https://via.placeholder.com/100x50?text=Nagad" alt="Nagad Logo" class="mx-auto">
                            <p class="mt-2 text-sm font-medium text-orange-600">Nagad</p>
                        </div>

                        <!-- Rocket -->
                        <div class="payment-method border p-4 rounded-lg text-center" data-method="rocket">
                            <img src="https://via.placeholder.com/100x50?text=Rocket" alt="Rocket Logo" class="mx-auto">
                            <p class="mt-2 text-sm font-medium text-orange-600">Rocket</p>
                        </div>

                        <!-- Upay -->
                        <div class="payment-method border p-4 rounded-lg text-center" data-method="upay">
                            <img src="https://via.placeholder.com/100x50?text=Upay" alt="Upay Logo" class="mx-auto">
                            <p class="mt-2 text-sm font-medium text-orange-600">Upay</p>
                        </div>

                        <!-- Banks -->
                        <div class="payment-method border p-4 rounded-lg text-center" data-method="bank">
                            <img src="https://via.placeholder.com/100x50?text=Bank" alt="Bank Logo" class="mx-auto">
                            <p class="mt-2 text-sm font-medium text-orange-600">Bank Transfer</p>
                        </div>
                    </div>
                </div>

                <!-- Hidden Input for Selected Method -->
                <input type="hidden" name="method" id="selectedMethod" required>

                <!-- Submit Button -->
                <div class="mt-6">
                    <button type="submit" class="w-full bg-orange-600 text-white py-2 px-4 rounded-lg shadow hover:bg-orange-700 focus:outline-none">Proceed to Pay</button>
                </div>
            </form>
        </div>
    </div>

    <!-- bKash Modal -->
    <div id="bkashModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeBkash">&times;</span>
            <h2>bKash Payment</h2>
            <form>
                <div class="mb-4">
                    <label for="bkashNumber" class="block text-sm font-medium text-gray-700">bKash Number</label>
                    <input type="text" id="bkashNumber" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter bKash number" required>
                </div>
                <div class="mb-4">
                    <label for="bkashPassword" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="bkashPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter password" required>
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2 px-4 rounded-lg shadow hover:bg-orange-700 focus:outline-none">Proceed to Pay</button>
            </form>
        </div>
    </div>

    <!-- Nagad Modal -->
    <div id="nagadModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeNagad">&times;</span>
            <h2>Nagad Payment</h2>
            <form>
                <div class="mb-4">
                    <label for="nagadNumber" class="block text-sm font-medium text-gray-700">Nagad Number</label>
                    <input type="text" id="nagadNumber" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter Nagad number" required>
                </div>
                <div class="mb-4">
                    <label for="nagadPassword" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="nagadPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter password" required>
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2 px-4 rounded-lg shadow hover:bg-orange-700 focus:outline-none">Proceed to Pay</button>
            </form>
        </div>
    </div>

    <!-- Rocket Modal -->
    <div id="rocketModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeRocket">&times;</span>
            <h2>Rocket Payment</h2>
            <form>
                <div class="mb-4">
                    <label for="rocketNumber" class="block text-sm font-medium text-gray-700">Rocket Number</label>
                    <input type="text" id="rocketNumber" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter Rocket number" required>
                </div>
                <div class="mb-4">
                    <label for="rocketPassword" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="rocketPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter password" required>
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2 px-4 rounded-lg shadow hover:bg-orange-700 focus:outline-none">Proceed to Pay</button>
            </form>
        </div>
    </div>

    <!-- Upay Modal -->
    <div id="upayModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeUpay">&times;</span>
            <h2>Upay Payment</h2>
            <form>
                <div class="mb-4">
                    <label for="upayNumber" class="block text-sm font-medium text-gray-700">Upay Number</label>
                    <input type="text" id="upayNumber" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter Upay number" required>
                </div>
                <div class="mb-4">
                    <label for="upayPassword" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="upayPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter password" required>
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2 px-4 rounded-lg shadow hover:bg-orange-700 focus:outline-none">Proceed to Pay</button>
            </form>
        </div>
    </div>

    <!-- Bank Transfer Modal -->
    <div id="bankModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeBank">&times;</span>
            <h2>Bank Transfer</h2>
            <form>
                <div class="mb-4">
                    <label for="bankName" class="block text-sm font-medium text-gray-700">Select Bank</label>
                    <select id="bankName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" required>
                        <option value="">Select a bank</option>
                        <option value="dutch_bangla">Dutch Bangla Bank</option>
                        <option value="sonali">Sonali Bank</option>
                        <option value="jonota">Jonota Bank</option>
                        <option value="islami">Islami Bank</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="accountNumber" class="block text-sm font-medium text-gray-700">Account Number</label>
                    <input type="text" id="accountNumber" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500" placeholder="Enter account number" required>
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2 px-4 rounded-lg shadow hover:bg-orange-700 focus:outline-none">Proceed to Pay</button>
            </form>
        </div>
    </div>

    <script src="payment.js"></script>
</body>
</html>
